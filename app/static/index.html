<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Reader · 论文双语阅读器</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='24' font-size='24'>📖</text></svg>">
</head>
<body>

<!-- ============================ 书库 ============================ -->
<section id="library" class="view">
  <header class="lib-head">
    <div>
      <h1>Paper Reader</h1>
      <p class="sub">上传 PDF · 自动切片 · 一段英文一段中文</p>
    </div>
    <div class="lib-actions">
      <span id="llmChip" class="chip">检测中…</span>
      <button class="btn ghost" id="glossaryBtn">术语表</button>
      <button class="btn ghost" id="statsBtn">用量</button>
    </div>
  </header>

  <div id="llmWarn" class="warn hidden"></div>

  <label id="drop" class="drop">
    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
    <strong>拖入 PDF 或点击选择文件</strong>
    <span class="sub">首次解析约 1–3 秒；已译段落会命中缓存，重复导入不再消耗 token</span>
    <span id="uploadState" class="upload-state"></span>
  </label>

  <ul id="docList" class="doc-list"></ul>
  <p id="libEmpty" class="empty">书库还是空的，先上传一篇论文吧。</p>
</section>

<!-- ============================ 阅读器 ============================ -->
<section id="reader" class="view hidden">
  <header class="topbar">
    <div class="tb-left">
      <button class="icon" id="backBtn" title="返回书库 (Esc)">←</button>
      <div class="tb-title">
        <h1 id="docTitle">—</h1>
        <span class="sub" id="docSub"></span>
      </div>
    </div>
    <div class="tb-right">
      <button class="icon" id="speakBtn" title="朗读全文 / 停止 (p)">▶</button>
      <div class="seg" id="modeSeg" role="group" aria-label="显示模式">
        <button data-mode="bi" class="on" title="双语对照 (m)">双语</button>
        <button data-mode="zh" title="仅中文 (m)">中</button>
        <button data-mode="en" title="仅英文 (m)">EN</button>
      </div>
      <button class="icon" id="fontMinus" title="缩小字号">A−</button>
      <button class="icon" id="fontPlus" title="放大字号">A+</button>
      <button class="icon" id="themeBtn" title="深浅色 (t)">◐</button>
      <button class="icon" id="pdfBtn" title="查看原始 PDF">PDF</button>
      <button class="icon" id="moreBtn" title="更多">⋯</button>
      <div class="progress"><i id="bar"></i></div>
    </div>
    <div class="menu hidden" id="moreMenu">
      <button id="resumeBtn">继续/重试未完成段落</button>
      <button id="retransAllBtn">重译全文（忽略缓存）</button>
      <button id="exportBtn">导出双语 Markdown</button>
      <button id="ttsCleanBtn">清理本篇语音缓存 <span class="sub" id="ttsSize"></span></button>
      <button id="ttsCleanAllBtn">清空全部语音缓存</button>
      <label class="menu-check">
        <input type="checkbox" id="ttsAutoChk"> 退出即清理语音缓存（返回书库 / 关闭页面 / 服务停止）
      </label>
      <label class="menu-check">
        <input type="checkbox" id="scopeChk"> 省流量：仅翻译可见段落
      </label>
      <label class="menu-check">朗读音色
        <select id="voiceSel"></select>
      </label>
    </div>
  </header>

  <div id="status" class="status hidden"></div>

  <!-- 语音播放条 -->
  <div class="player hidden" id="player">
    <div class="pl-progress" id="plProgress" title="点击或拖动跳转"><i id="plBar"></i></div>
    <div class="pl-row">
      <button class="icon" id="plPrev" title="上一段">⏮</button>
      <button class="pl-skip" id="plBack" title="后退 3 秒（←）">−3s</button>
      <button class="icon pl-play" id="plToggle" title="播放/暂停（空格）">▶</button>
      <button class="pl-skip" id="plFwd" title="快进 3 秒（→）">+3s</button>
      <button class="icon" id="plNext" title="下一段">⏭</button>
      <span class="pl-time" id="plTime">0:00 / 0:00</span>
      <span class="pl-seg" id="plSeg">—</span>
      <select id="plRate" title="语速">
        <option value="0.75">0.75×</option>
        <option value="1" selected>1.0×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2.0×</option>
      </select>
      <button class="icon" id="plClose" title="关闭播放器">✕</button>
    </div>
  </div>
  <main class="reader" id="content"></main>
  <div class="reader-end" id="readerEnd"></div>
</section>

<!-- ============================ 弹层 ============================ -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <header>
      <h2 id="modalTitle">术语表</h2>
      <button class="icon" id="modalClose">✕</button>
    </header>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite">
  <span class="toast-icon" id="toastIcon">🧹</span>
  <div class="toast-body">
    <strong id="toastTitle">已清理语音缓存</strong>
    <span id="toastMsg"></span>
  </div>
  <button class="icon" id="toastClose" title="关闭">✕</button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
