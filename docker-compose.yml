services:
  paper-reader:
    build:
      context: .
      # 国内网络可取消注释，用镜像源加速 pip
      # args:
      #   PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: paper-reader:latest
    container_name: paper-reader
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      TZ: Asia/Shanghai
    volumes:
      # 数据目录刻意放在项目之外：SQLite 的 db/-wal/-shm 三件套必须同生共死，
      # 而项目目录在 ~/Desktop 下，容易被同步/备份工具或手动清理碰到——2026-09-20
      # 的数据库损坏与 2026-10-08 的 WAL 丢失都源于此。可用 DATA_HOST_DIR 覆盖。
      - "${DATA_HOST_DIR:-/Users/Zhuanz1/paper-reader-data}:/data"
    # Linux 上访问宿主机上的本地模型服务（macOS/Windows 自带，加了也无害）
    extra_hosts:
      - "host.docker.internal:host-gateway"
